# Build-only check for branches other than main: catches errors before anything goes live.
name: Check build
on:
  push:
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Save the built site to a "preview-build" branch so it can be checked before going live.
      - run: |
          cd dist
          git init -q -b preview-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "preview of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-build
